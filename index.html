<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla IPTV Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        input, button { touch-action: manipulation; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-amber-500 flex items-center gap-2">
            ⚡ Tesla IPTV Streamer
        </h1>
        <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-full text-zinc-400 border border-zinc-700" id="connection-status">
            Durum: M3U Yükleniyor...
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- Video / Canvas Player Container -->
        <div class="flex-1 bg-black rounded-xl overflow-hidden relative flex items-center justify-center border border-zinc-800 shadow-2xl">
            <video id="html5-player" class="w-full h-full object-contain" controls autoplay playsinline></video>
            
            <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950/80 text-zinc-500">
                <svg class="w-16 h-16 mb-2 text-zinc-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-sm">Listeden bir kanal seçin.</p>
            </div>
        </div>

        <!-- Sidebar Control Panel -->
        <div class="w-full lg:w-96 bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col gap-4 shadow-lg overflow-hidden">
            
            <div class="flex flex-col gap-2 flex-1 overflow-hidden">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-zinc-300">Kanal Listesi (GitHub'dan)</label>
                    <button onclick="loadGithubM3U()" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-amber-400 px-2 py-1 rounded border border-zinc-700">Yenile</button>
                </div>

                <!-- Channel Search Bar -->
                <input type="text" id="search-channel" oninput="filterChannels()" placeholder="Kanal ara..." class="bg-zinc-950 border border-zinc-800 text-zinc-300 text-xs rounded-lg p-2 focus:outline-none">

                <!-- Channel List Container -->
                <div id="channel-list" class="flex-1 overflow-y-auto flex flex-col gap-1 pr-1 border-t border-zinc-800 pt-2 text-xs">
                    <div class="text-zinc-500 text-center py-4">Kanallar yükleniyor...</div>
                </div>
            </div>

            <!-- Log Box -->
            <div id="log-box" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2 h-16 overflow-y-auto font-mono text-[10px] text-zinc-400">
                [Sistem] Başlatılıyor...<br>
            </div>
        </div>
    </main>

    <script>
        let channels = [];
        let hlsInstance = null;

        // GitHub Raw dosya bağlantısı
        const M3U_URL = "https://raw.githubusercontent.com/orkunnyilmazz-crypto/tesslaaa/main/liste.m3u";

        const logBox = document.getElementById('log-box');
        const statusBadge = document.getElementById('connection-status');
        const videoElement = document.getElementById('html5-player');
        const placeholder = document.getElementById('player-placeholder');
        const channelListDiv = document.getElementById('channel-list');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        window.onload = function() {
            loadGithubM3U();
        };

        function loadGithubM3U() {
            log(`GitHub Raw'dan liste çekiliyor...`);
            
            fetch(M3U_URL)
                .then(res => {
                    if (!res.ok) throw new Error(`Dosya alınamadı (HTTP ${res.status})`);
                    return res.text();
                })
                .then(text => {
                    parseM3U(text);
                    statusBadge.innerText = "Durum: Hazır";
                    statusBadge.className = "text-xs bg-green-950 text-green-400 px-3 py-1.5 rounded-full border border-green-800";
                })
                .catch(err => {
                    log(`Hata: ${err.message}`);
                    statusBadge.innerText = "Durum: Dosya Hatası";
                    statusBadge.className = "text-xs bg-red-950 text-red-400 px-3 py-1.5 rounded-full border border-red-800";
                    channelListDiv.innerHTML = `<div class="text-red-400 text-center py-4">Liste okunamadı. Raw bağlantısını kontrol edin!</div>`;
                });
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameParts = line.split(',');
                    const name = nameParts.length > 1 ? nameParts.slice(1).join(',') : 'Bilinmeyen Kanal';
                    currentChannel = { name: name.trim(), url: '' };
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            log(`${channels.length} kanal başarıyla yüklendi.`);
            renderChannels(channels);
        }

        function renderChannels(list) {
            channelListDiv.innerHTML = '';
            if (list.length === 0) {
                channelListDiv.innerHTML = '<div class="text-zinc-500 text-center py-4">Kanal bulunamadı.</div>';
                return;
            }

            list.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-2.5 rounded bg-zinc-950 hover:bg-zinc-800 border border-zinc-800/80 text-zinc-300 hover:text-amber-400 truncate transition';
                btn.innerText = `${idx + 1}. ${ch.name}`;
                btn.onclick = () => playStream(ch.url, ch.name);
                channelListDiv.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = document.getElementById('search-channel').value.toLowerCase();
            const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        function playStream(url, channelName) {
            placeholder.classList.add('hidden');
            log(`Oynatılıyor: ${channelName}`);
            statusBadge.innerText = `Oynatılıyor: ${channelName}`;

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('.ts'))) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoElement);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play();
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) log(`Akış Hatası: ${data.type}`);
                });
            } else {
                videoElement.src = url;
                videoElement.play().catch(err => log(`Oynatma Hatası: ${err.message}`));
            }
        }
    </script>
</body>
</html>
