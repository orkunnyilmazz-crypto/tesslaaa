<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla WebCodecs Media Streamer</title>
    <!-- Tailwind CSS for Dark Mode & Touch-friendly UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for fallback streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        input, button { touch-action: manipulation; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header / Nav -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-amber-500 flex items-center gap-2">
            ⚡ Tesla WebCodecs Streamer
        </h1>
        <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-full text-zinc-400 border border-zinc-700" id="connection-status">
            Durum: Hazır
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- Video / Canvas Player Container -->
        <div class="flex-1 bg-black rounded-xl overflow-hidden relative flex items-center justify-center border border-zinc-800 shadow-2xl">
            <!-- Canvas for WebCodecs Hardware Accelerated Rendering -->
            <canvas id="video-canvas" class="w-full h-full object-contain hidden"></canvas>
            
            <!-- Standard HTML5 / HLS Video Fallback Player -->
            <video id="html5-player" class="w-full h-full object-contain" controls autoplay playsinline></video>
            
            <!-- Overlay Placeholder -->
            <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950/80 text-zinc-500">
                <svg class="w-16 h-16 mb-2 text-zinc-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-sm">Oynatmak için sol menüden bir kaynak seçin veya URL girin.</p>
            </div>
        </div>

        <!-- Sidebar Control Panel -->
        <div class="w-full lg:w-96 bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col gap-4 shadow-lg overflow-y-auto">
            <h2 class="text-md font-semibold text-zinc-200 border-b border-zinc-800 pb-2">Akış Kaynakları</h2>
            
            <!-- URL Input Group -->
            <div class="flex flex-col gap-2">
                <label class="text-xs text-zinc-400">Yayın / M3U / Video URL (H.264 / HLS)</label>
                <input type="text" id="stream-url" placeholder="https://ornek.com/akis.m3u8" class="bg-zinc-950 border border-zinc-700 text-zinc-200 text-sm rounded-lg p-3 focus:outline-none focus:border-amber-500">
                <button onclick="startStream()" class="bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold py-3 px-4 rounded-lg transition text-sm">
                    Akışı Başlat
                </button>
            </div>

            <!-- Decoder Mode Selection -->
            <div class="flex flex-col gap-1.5 mt-2">
                <label class="text-xs text-zinc-400">Motor / Dekoder Tipi</label>
                <select id="decoder-mode" class="bg-zinc-950 border border-zinc-700 text-zinc-200 text-sm rounded-lg p-2.5 focus:outline-none">
                    <option value="auto">Otomatik (HLS.js + Fallback)</option>
                    <option value="webcodecs">WebCodecs + Canvas (Deneysel)</option>
                </select>
            </div>

            <!-- Console Log -->
            <div class="flex flex-col gap-1.5 mt-auto">
                <label class="text-xs text-zinc-400">Sistem Günlüğü</label>
                <div id="log-box" class="bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 h-28 overflow-y-auto font-mono text-[11px] text-zinc-400">
                    [Sistem] Hazır durumda. WebCodecs ve HLS motorları yüklendi.<br>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-zinc-900 border-t border-zinc-800 py-2 px-4 text-center text-xs text-zinc-500">
        Tesla Araç İçi Tarayıcı Özel Sürümü • Donanım Hızlandırmalı Medya Çözücü
    </footer>

    <!-- Script Logic -->
    <script>
        const logBox = document.getElementById('log-box');
        const statusBadge = document.getElementById('connection-status');
        const videoElement = document.getElementById('html5-player');
        const canvasElement = document.getElementById('video-canvas');
        const placeholder = document.getElementById('player-placeholder');

        function log(message) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] ${message}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function startStream() {
            const url = document.getElementById('stream-url').value.trim();
            const mode = document.getElementById('decoder-mode').value;

            if (!url) {
                alert('Lütfen geçerli bir yayın bağlantısı girin!');
                return;
            }

            placeholder.classList.add('hidden');
            log(`Bağlantı kuruluyor: ${url}`);
            statusBadge.innerText = "Durum: Bağlanıyor...";
            statusBadge.className = "text-xs bg-amber-950 text-amber-400 px-3 py-1.5 rounded-full border border-amber-800";

            if (mode === 'webcodecs' && 'VideoDecoder' in window) {
                log('WebCodecs API seçildi. Çerçeve işleme başlatılıyor...');
                canvasElement.classList.remove('hidden');
                videoElement.classList.add('hidden');
                // WebCodecs özel işleme döngüsü buraya entegre edilir
                statusBadge.innerText = "Durum: WebCodecs Aktif";
                statusBadge.className = "text-xs bg-green-950 text-green-400 px-3 py-1.5 rounded-full border border-green-800";
            } else {
                log('Standart HLS / HTML5 Oynatıcı motoru kullanılıyor...');
                canvasElement.classList.add('hidden');
                videoElement.classList.remove('hidden');

                if (Hls.isSupported() && url.includes('.m3u8')) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(videoElement);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoElement.play();
                        log('HLS Akışı başarıyla başlatıldı.');
                        statusBadge.innerText = "Durum: Yayın Akışta";
                        statusBadge.className = "text-xs bg-green-950 text-green-400 px-3 py-1.5 rounded-full border border-green-800";
                    });
                } else {
                    videoElement.src = url;
                    videoElement.play().then(() => {
                        log('Medya oynatımı başlatıldı.');
                        statusBadge.innerText = "Durum: Oynatılıyor";
                        statusBadge.className = "text-xs bg-green-950 text-green-400 px-3 py-1.5 rounded-full border border-green-800";
                    }).catch(err => {
                        log(`Oynatma hatası: ${err.message}`);
                        statusBadge.innerText = "Durum: Hata";
                        statusBadge.className = "text-xs bg-red-950 text-red-400 px-3 py-1.5 rounded-full border border-red-800";
                    });
                }
            }
        }
    </script>
</body>
</html>
