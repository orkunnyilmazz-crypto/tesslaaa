<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeslaTV Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Üst Başlık -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex flex-col sm:flex-row items-center justify-between gap-3">
        <h1 class="text-xl font-bold text-cyan-400">TESLA TV</h1>
        <input type="text" id="searchInput" placeholder="Kanal ara..." 
            class="w-full sm:w-80 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
    </header>

    <!-- Ana Ekran / Oynatıcı ve Liste Bölünmüş Alan -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-4">
        
        <!-- Sol / Üst Taraf: Aktif Oynatıcı -->
        <div class="w-full lg:w-2/3 flex flex-col gap-2">
            <div class="bg-black rounded-xl overflow-hidden border border-slate-800 aspect-video flex items-center justify-center relative shadow-xl">
                <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain"></video>
                <div id="noStream" class="absolute text-slate-500 text-sm">İzlemek için bir kanala tıklayın</div>
            </div>
            <div id="currentChannelName" class="text-cyan-400 font-semibold text-lg px-1">Seçilen Kanal: Yok</div>
        </div>

        <!-- Sağ / Alt Taraf: Kanal Listesi -->
        <div class="w-full lg:w-1/3 flex flex-col bg-slate-900/50 border border-slate-800 rounded-xl p-4 h-[600px] overflow-y-auto">
            <div id="loading" class="text-center py-10 text-slate-400">Kanallar yükleniyor...</div>
            <div id="channelList" class="flex flex-col gap-2"></div>
        </div>
    </main>

    <script>
        let allChannels = [];

        async function loadChannels() {
            try {
                const response = await fetch('list.m3u');
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'list.m3u bulunamadı!';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            allChannels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let titleMatch = line.match(/,(.+)$/);
                    currentChannel.name = titleMatch ? titleMatch[1] : 'Kanal';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    allChannels.push(currentChannel);
                    currentChannel = {};
                }
            }

            document.getElementById('loading').style.display = 'none';
            renderChannels(allChannels);
        }

        function renderChannels(channels) {
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            
            if (channels.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-slate-500">Kanal bulunamadı.</div>';
                return;
            }

            channels.forEach((channel, index) => {
                const item = document.createElement('div');
                item.className = 'bg-slate-800 hover:bg-slate-700/80 border border-slate-700/50 p-3 rounded-lg flex items-center justify-between cursor-pointer transition-colors';
                item.innerHTML = `
                    <span class="text-sm font-medium truncate pr-2">${index + 1}. ${channel.name}</span>
                    <span class="bg-cyan-500/20 text-cyan-400 text-xs px-2.5 py-1 rounded font-semibold shrink-0">Oynat</span>
                `;
                item.onclick = () => playChannel(channel.name, channel.url);
                list.appendChild(item);
            });
        }

        function playChannel(name, url) {
            document.getElementById('currentChannelName').innerText = "Oynatılıyor: " + name;
            document.getElementById('noStream').style.display = 'none';
            const video = document.getElementById('videoPlayer');
            video.src = url;
            video.play().catch(e => console.log("Oynatma hatası:", e));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(term));
            renderChannels(filtered);
        });

        loadChannels();
    </script>
</body>
</html>
