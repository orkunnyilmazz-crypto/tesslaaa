<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla IPTV Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; }
        input, button { touch-action: manipulation; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header (Mavi Tema) -->
    <header class="bg-blue-950 border-b border-blue-800 p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
            ⚡ Tesla IPTV Streamer <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded">Dosya Modu</span>
        </h1>
        <div class="text-xs bg-blue-900 text-blue-200 px-3 py-1.5 rounded-full border border-blue-700" id="connection-status">
            Durum: Dosya Bekleniyor...
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- Video Player Container -->
        <div class="flex-1 bg-slate-950 rounded-xl overflow-hidden relative flex items-center justify-center border border-blue-900/50 shadow-2xl">
            <video id="html5-player" class="w-full h-full object-contain" controls autoplay playsinline></video>
            
            <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-blue-950/40 text-blue-300">
                <svg class="w-16 h-16 mb-2 text-blue-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-sm font-medium">Listeden bir kanal seçin.</p>
            </div>
        </div>

        <!-- Sidebar Control Panel -->
        <div class="w-full lg:w-96 bg-slate-900 border border-blue-900/40 rounded-xl p-4 flex flex-col gap-4 shadow-lg overflow-hidden">
            
            <div class="flex flex-col gap-2 flex-1 overflow-hidden">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-blue-300">Kanal Listesi (liste.m3u)</label>
                    <button onclick="loadM3UFile()" class="text-[10px] bg-blue-800 hover:bg-blue-700 text-blue-100 px-2 py-1 rounded border border-blue-600">Yenile</button>
                </div>

                <!-- Channel Search Bar -->
                <input type="text" id="search-channel" oninput="filterChannels()" placeholder="Kanal ara..." class="bg-slate-950 border border-blue-900 text-blue-100 text-xs rounded-lg p-2 focus:outline-none focus:border-blue-500">

                <!-- Channel List Container -->
                <div id="channel-list" class="flex-1 overflow-y-auto flex flex-col gap-1 pr-1 border-t border-blue-900/40 pt-2 text-xs">
                    <div class="text-blue-400 text-center py-4">Liste yükleniyor...</div>
                </div>
            </div>

            <!-- Log Box -->
            <div id="log-box" class="bg-slate-950 border border-blue-900/40 rounded-lg p-2 h-16 overflow-y-auto font-mono text-[10px] text-blue-300">
                [Sistem] jsDislrV dosya okuma modu başlatıldı.<br>
            </div>
        </div>
    </main>

    <script>
        // jsDelivr CDN üzerinden GitHub'daki dosyanı doğrudan ve hatasız çeker
        const M3U_URL = "https://cdn.jsdelivr.net/gh/orkunnyilmazz-crypto/tesslaaa@main/liste.m3u";

        let channels = [];
        let hlsInstance = null;

        const logBox = document.getElementById('log-box');
        const statusBadge = document.getElementById('connection-status');
        const videoElement = document.getElementById('html5-player');
        const placeholder = document.getElementById('player-placeholder');
        const channelListDiv = document.getElementById('channel-list');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        window.onload = function() {
            loadM3UFile();
        };

        function loadM3UFile() {
            log(`Dosya CDN üzerinden okunuyor...`);
            statusBadge.innerText = "Durum: Yükleniyor...";

            fetch(M3U_URL)
                .then(res => {
                    if (!res.ok) throw new Error(`Dosya bulunamadı (HTTP ${res.status})`);
                    return res.text();
                })
                .then(text => {
                    parseM3U(text);
                    statusBadge.innerText = "Durum: Hazır (Dosyadan Okundu)";
                    statusBadge.className = "text-xs bg-blue-900 text-blue-200 px-3 py-1.5 rounded-full border border-blue-700";
                })
                .catch(err => {
                    log(`Hata: ${err.message}`);
                    statusBadge.innerText = "Durum: Dosya Okunamadı";
                    statusBadge.className = "text-xs bg-red-950 text-red-400 px-3 py-1.5 rounded-full border border-red-800";
                    channelListDiv.innerHTML = `<div class="text-red-400 text-center py-4">"liste.m3u" dosyası okunamadı. Deponun Public (Açık) olduğundan emin olun!</div>`;
                });
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameParts = line.split(',');
                    const name = nameParts.length > 1 ? nameParts.slice(1).join(',') : 'Bilinmeyen Kanal';
                    currentChannel = { name: name.trim(), url: '' };
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            log(`${channels.length} kanal dosyadan başarıyla çekildi.`);
            renderChannels(channels);
        }

        function renderChannels(list) {
            channelListDiv.innerHTML = '';
            if (list.length === 0) {
                channelListDiv.innerHTML = '<div class="text-blue-400 text-center py-4">Kanal bulunamadı.</div>';
                return;
            }

            list.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-2.5 rounded bg-slate-950 hover:bg-blue-950 border border-blue-900/50 text-blue-200 hover:text-blue-400 truncate transition flex items-center justify-between';
                btn.innerHTML = `<span>${idx + 1}. ${ch.name}</span><span class="text-[10px] text-blue-400">Oynat</span>`;
                btn.onclick = () => playStream(ch.url, ch.name);
                channelListDiv.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = document.getElementById('search-channel').value.toLowerCase();
            const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        function playStream(url, channelName) {
            placeholder.classList.add('hidden');
            log(`Oynatılıyor: ${channelName}`);
            statusBadge.innerText = `Oynatılıyor: ${channelName}`;

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('.ts') || url.includes('?m3u8'))) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoElement);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play();
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) log(`Akış Hatası: ${data.type}`);
                });
            } else {
                videoElement.src = url;
                videoElement.play().catch(err => log(`Oynatma Hatası: ${err.message}`));
            }
        }
    </script>
</body>
</html>
