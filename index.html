<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeslaTV Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .channel-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Üst Bilgi ve Arama Çubuğu -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 shadow-lg">
        <div class="flex items-center gap-3">
            <span class="text-2xl">📺</span>
            <h1 class="text-xl font-bold tracking-wider text-cyan-400">TESLA TV</h1>
        </div>
        <div class="w-full md:w-96">
            <input type="text" id="searchInput" placeholder="Kanal ara..." 
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-cyan-500 transition-colors">
        </div>
    </header>

    <!-- Kanal Listesi Alanı -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6">
        <div id="loading" class="text-center py-20 text-slate-400 text-lg">Kanallar yükleniyor...</div>
        <div id="channelGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <!-- Video Oynatıcı Modalı -->
    <div id="playerModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-4xl flex justify-between items-center mb-4">
            <h2 id="modalTitle" class="text-lg font-semibold text-cyan-400">Yayın</h2>
            <button onclick="closePlayer()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Kapat ✕</button>
        </div>
        <div class="w-full max-w-4xl aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center">
            <video id="videoPlayer" controls autoplay class="w-full h-full"></video>
        </div>
    </div>

    <!-- M3U Çözücü ve Arayüz Scripti -->
    <script>
        let allChannels = [];

        async function loadChannels() {
            try {
                const response = await fetch('list.m3u');
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Kanal listesi (list.m3u) yüklenemedi!';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            allChannels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let titleMatch = line.match(/,(.+)$/);
                    currentChannel.name = titleMatch ? titleMatch.label || titleMatch[1] : 'Kanal';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    allChannels.push(currentChannel);
                    currentChannel = {};
                }
            }

            document.getElementById('loading').style.display = 'none';
            renderChannels(allChannels);
        }

        function renderChannels(channels) {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';
            
            if (channels.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">Kanal bulunamadı.</div>';
                return;
            }

            channels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-cyan-500/50 p-4 rounded-2xl cursor-pointer transition-all flex flex-col items-center text-center gap-2 shadow-md';
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-xl bg-slate-700/50 flex items-center justify-center text-xl text-cyan-400 font-bold">📺</div>
                    <span class="text-sm font-medium line-clamp-2">${channel.name}</span>
                `;
                card.onclick = () => playChannel(channel.name, channel.url);
                grid.appendChild(card);
            });
        }

        function playChannel(name, url) {
            document.getElementById('modalTitle').innerText = name;
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoPlayer');
            modal.classList.remove('hidden');
            video.src = url;
            video.play().catch(e => console.log("Oynatma hatası:", e));
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.src = '';
            modal.classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(term));
            renderChannels(filtered);
        });

        loadChannels();
    </script>
</body>
</html>
